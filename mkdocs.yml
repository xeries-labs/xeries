site_name: xeries
site_description: Conditional Feature Importance for Multi-Time Series Forecasting
site_url: https://xeries-labs.github.io/xeries
repo_url: https://github.com/xeries-labs/xeries
repo_name: xeries-labs/xeries

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mermaid2
  - mkdocs-jupyter:
      include_source: true
      execute: false
      include_requirejs: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
            merge_init_into_class: true

hooks:
  - mkdocs_hooks.py

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture:
      - Overview: architecture/index.md
      - Core: architecture/core.md
      - Importance: architecture/importance.md
      - Partitioners: architecture/partitioners.md
      - Adapters: architecture/adapters.md
      - Hierarchy: architecture/hierarchy.md
      - Visualization: architecture/visualization.md
  - Tutorials:
      - Quickstart: tutorials/quickstart.md
  - Examples:
      - Overview: examples.md
      - Quickstart:
          - Basic Usage: examples/quickstart/01_basic_usage.ipynb
      - Conditional Permutation:
          - Per-Series Importance: examples/conditional_permutation/01_per_series_importance.ipynb
          - Exogenous Features: examples/conditional_permutation/02_exogenous_features.ipynb
          - Per-Series with Exogenous: examples/conditional_permutation/03_per_series_exog.ipynb
          - Tree Partitioner: examples/conditional_permutation/04_tree_partitioner.ipynb
      - Hierarchical:
          - Demand Forecasting: examples/hierarchical/01_hierarchical_demand_forecasting.ipynb
          - Per-Series SHAP: examples/hierarchical/02_per_series_shap.ipynb
      - Integrations:
          - Skforecast: examples/integrations/01_skforecast.ipynb
  - API Reference:
      - Overview: api/reference.md
      - Importance: api/importance.md
      - Partitioners: api/partitioners.md
      - Adapters: api/adapters.md
      - Hierarchy: api/hierarchy.md
      - Visualization: api/visualization.md
  - Contributing:
      - Spec-Driven Development: contributing-sdd.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xeries-labs/xeries
